const A='/assets/';const P=[{id:'kitlab-fs',n:'01',title:'KitLab FS',kind:'E-commerce',groups:['product','ecommerce','brand'],tone:'mint',img:A+'figma/kitlab-hero.jpg',desc:'A storefront system that makes teamwear easier to browse, compare, and buy.',role:'UX / UI / system',platform:'Web / responsive',focus:'Decision confidence',video:A+'video/kitlab-transition-4k.mp4'},{id:'matchup',n:'02',title:'MatchUp',kind:'Product design',groups:['product'],tone:'lilac',img:A+'figma/matchup-hero.jpg',desc:'A clearer way to discover games, people, and momentum in one social sports product.',role:'Product / interaction',platform:'Mobile / social',focus:'Finding your people',video:A+'video/matchup-transition-4k.mp4'},{id:'commerceflow',n:'03',title:'CommerceFlow',kind:'Product design',groups:['product'],tone:'blue',img:A+'figma/commerce-dashboard.jpg',desc:'Turning operational complexity into a dashboard teams can read at a glance.',role:'Product / data viz',platform:'Desktop / operations',focus:'Making signal visible'}];
const C={};C['kitlab-fs']={p:P[0],title:'The front door to a better kit.',hero:A+'figma/kitlab-hero.jpg',shots:[[A+'figma/kitlab-product.png','Product detail — make the choice tangible'],[A+'figma/kitlab-mobile.png','Responsive behaviour'],[A+'figma/kitlab-cart.png','Checkout confidence']],quote:'From catalogue noise to a confident kit.',dec:[['Make the first choice obvious.','Category and intent are the shortest path into a catalogue that can otherwise feel endless.'],['Compare without resetting.','Persistent selections keep the user’s mental model intact as they explore options.'],['Let the product feel real.','Visual hierarchy and motion turn a functional order into a kit people can picture wearing.']]};C.matchup={p:P[1],title:'Find your people. Find your game.',hero:A+'figma/matchup-hero.jpg',shots:[[A+'figma/matchup-home.png','Home — put momentum first'],[A+'figma/matchup-preview.png','Preview — make the next step clear'],[A+'figma/matchup-results.png','Results — keep the community visible']],quote:'Social products work when the next action feels natural.',dec:[['Lead with momentum.','The home surface makes the active game the most obvious place to begin.'],['Make context visible.','Preview states answer the small questions that stop people from joining in.'],['Keep the human signal.','Profiles, availability, and tone make the interface feel like a community rather than a directory.']]};C.commerceflow={p:P[2],title:'Turn operational noise into a next move.',hero:A+'figma/commerce-dashboard.jpg',shots:[[A+'figma/commerce-dashboard.jpg','Dashboard — the signal at a glance'],[A+'figma/commerce-dashboard.jpg','System — hierarchy that scales'],[A+'figma/commerce-dashboard.jpg','Decision — data with a point of view']],quote:'A dashboard is a conversation with the next decision.',dec:[['Separate status from action.','The hierarchy makes it clear what is happening and what needs attention now.'],['Use rhythm as navigation.','Consistent spacing and colour give dense information a readable cadence.'],['Make the exception legible.','The most important moments are often the outliers, not the averages.']]};

function home(){return frame(`<section class="hero"><div class="hero-grid"><div><span class="eyebrow">The lobby / product + visual designer</span><h1 class="reveal">I design the moment a good idea <em>lands.</em></h1></div><div class="hero-copy reveal"><strong>For recruiters & clients</strong>Clear products, commerce experiences, and identities built for the next move.</div></div><div class="hero-bar"><span class="mono">Toronto / available for selected projects</span><a href="#work">Choose a table <span>↓</span></a></div></section><section class="section" id="work"><div class="section-head"><span class="number mono">01 / Tables</span><h2>Pick a discipline.<br>Follow the signal.</h2><p>Three case studies. Four areas of practice. One clear next move.</p></div><div class="filters"><button class="filter active" data-filter="all">All work <span>03</span></button><button class="filter" data-filter="product">Product design <span>03</span></button><button class="filter" data-filter="ecommerce">E-commerce <span>01</span></button><button class="filter" data-filter="brand">Brand systems <span>01</span></button><button class="filter" data-filter="print">Print / editorial <span>00</span></button></div><div class="table-note" id="tableNote">No live case study at this table yet. Reserved for the next hand.</div><div class="work-grid">${P.map(card).join('')}</div></section><section class="section"><div class="system-grid"><h2>Professional enough for the room. Memorable enough to stay.</h2><div class="system-copy"><p>I find the signal, build the language, and make the interface feel present.</p><p>Clarity first. Character always.</p></div></div><div class="system-list"><div class="system-row reveal"><strong>01</strong><h3>Find the signal</h3><p>Research, constraints, and the one decision that changes everything.</p></div><div class="system-row reveal"><strong>02</strong><h3>Build the language</h3><p>Flows, type, colour, and a visual system that holds together.</p></div><div class="system-row reveal"><strong>03</strong><h3>Make it move</h3><p>Motion details that make the system feel alive without slowing it down.</p></div></div></section><section class="cta"><span class="eyebrow" style="justify-content:center">The exit is also an invitation</span><h2>Have a good problem?<br><em>Deal me in.</em></h2><a href="/contact" data-route="contact">Start a conversation ↗</a></section>`)}
function work(){return frame(`<section class="intro"><span class="eyebrow">01 / Archive</span><h1>Choose your table.</h1><p>Case studies organized by the kind of problem they solve.</p></section><section class="section"><div class="filters"><button class="filter active" data-filter="all">All work <span>03</span></button><button class="filter" data-filter="product">Product design <span>03</span></button><button class="filter" data-filter="ecommerce">E-commerce <span>01</span></button><button class="filter" data-filter="brand">Brand systems <span>01</span></button><button class="filter" data-filter="print">Print / editorial <span>00</span></button></div><div class="table-note" id="tableNote">No live case study at this table yet. Reserved for the next hand.</div><div class="archive">${P.map((p)=>`<a class="archive-row reveal" href="/work/${p.id}" data-route="${p.id}" data-group="${p.groups.join(' ')}" style="--row:var(--${p.tone})"><span class="num">${p.n}</span><h3>${p.title}</h3><p>${p.desc}</p><span class="kind">${p.kind}</span><span class="arrow">↗</span><img class="peek" src="${p.img}" alt="${p.title} preview"></a>`).join('')}</div></section><section class="cta"><span class="eyebrow" style="justify-content:center">02 / Next move</span><h2>See the system behind the work.</h2><a href="/about" data-route="about">Meet the designer ↗</a></section>`,'Work — Alejandro Hennessey')}
function about(){return frame(`<section class="intro"><span class="eyebrow">02 / About</span><h1>Design with a point of view. Deliver with a clear head.</h1></section><section class="section"><div class="about-grid"><p>I’m Alejandro, a Toronto-based product and visual designer. I turn <mark>messy questions into useful, recognisable things.</mark></p><aside>My background moves between product, graphic design, and architecture.<br><br>Available for product, commerce, identity, and visual design collaborations.</aside></div><div class="timeline"><div class="job reveal"><h3>Independent practice</h3><p>Product design, commerce experiences, brand systems, and creative direction.</p><time>2023—now</time></div><div class="job reveal"><h3>Product designer</h3><p>End-to-end product experiences, design systems, and launch-ready interfaces.</p><time>2021—2023</time></div><div class="job reveal"><h3>Architecture + interiors</h3><p>Constraints, circulation, material, and the invisible details that make a space work.</p><time>Earlier</time></div></div></section><section class="section"><div class="section-head"><span class="number mono">The house rules</span><h2>Clarity creates room for character.</h2><p>Recruiter-friendly at first glance. Deep enough to reward a closer look.</p></div><div class="system-list"><div class="system-row reveal"><strong>01</strong><h3>Structure before decoration</h3><p>Make the important thing easy to notice.</p></div><div class="system-row reveal"><strong>02</strong><h3>Details are part of strategy</h3><p>The right interaction changes how the whole product feels.</p></div><div class="system-row reveal"><strong>03</strong><h3>Leave room for surprise</h3><p>Professional does not have to mean predictable.</p></div></div></section><section class="cta"><h2>Want to see the work?</h2><a href="/work" data-route="work">Return to the tables ↗</a></section>`,'About — Alejandro Hennessey')}
function media(c){return c.p.video?`<video class="case-cover" autoplay muted loop playsinline poster="${c.hero}"><source src="${c.p.video}" type="video/mp4"></video>`:`<img class="case-cover" src="${c.hero}" alt="${c.p.title} project hero">`}
function casePage(id){let c=C[id]||C['kitlab-fs'],p=c.p,next=id==='kitlab-fs'?'matchup':id==='matchup'?'commerceflow':'kitlab-fs';return frame(`<section class="case-intro"><div><span class="eyebrow">${p.n} / ${p.kind} / Case study</span><h1>${c.title}</h1></div><p>${p.desc}</p></section>${media(c)}<div class="metadata"><div><span>Role</span>${p.role}</div><div><span>Platform</span>${p.platform}</div><div><span>Focus</span>${p.focus}</div><div><span>Route</span>Brief → system → shipped</div></div><section class="case-body"><p>This project started with a familiar problem: the product had plenty of capability, but the experience made people work too hard to understand what mattered.</p><div class="quote">“${c.quote}”</div><span class="eyebrow">The hand</span><h2 style="margin:20px 0 35px">Structure first.<br>Character second.</h2><div class="decision-list">${c.dec.map((d,i)=>`<div class="decision reveal"><strong>0${i+1}</strong><h3>${d[0]}</h3><p>${d[1]}</p></div>`).join('')}</div><div class="screens">${c.shots.map(s=>`<figure class="reveal"><img src="${s[0]}" alt="${s[1]}"><figcaption>${s[1]}</figcaption></figure>`).join('')}</div><a class="next" href="/work/${next}" data-route="${next}"><span><small>Next case</small><strong>${C[next].p.title}</strong></span><span class="arrow">↗</span></a></section>`,`${p.title} — Alejandro Hennessey`)}
function contact(){return frame(`<section class="intro"><span class="eyebrow">03 / Contact</span><div class="contact"><div><h1>The best projects start with a good question.</h1><div class="contact-links"><a href="mailto:hello@alejandrohennessey.com">Email <span>↗</span></a><a href="https://www.linkedin.com" target="_blank" rel="noreferrer">LinkedIn <span>↗</span></a><a href="https://www.are.na" target="_blank" rel="noreferrer">Are.na <span>↗</span></a></div></div><div><p class="contact-copy">Available for product, commerce, identity, and visual design collaborations.</p><form id="form"><label for="name">Your name</label><input id="name" required placeholder="Name"><label for="email">Your email</label><input id="email" required type="email" placeholder="you@company.com"><label for="message">The brief</label><textarea id="message" required placeholder="I’m working on..."></textarea><button type="submit">Open an email <span>↗</span></button><p class="status" id="status">Your email client is ready to open.</p></form></div></div></section>`,'Contact — Alejandro Hennessey')}
function render(){let r=route(),view=r==='home'?home():r==='work'?work():r==='about'?about():r==='contact'?contact():casePage(r);document.getElementById('app').innerHTML=view;document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.route===r||(C[r]&&a.dataset.route==='work')));bind();requestAnimationFrame(()=>document.querySelectorAll('.reveal').forEach((x,i)=>setTimeout(()=>x.classList.add('in'),Math.min(i*35,260))));window.scrollTo(0,0)}
function bind(){document.querySelectorAll('a[data-route]').forEach(a=>a.addEventListener('click',e=>{if(a.getAttribute('href')===location.pathname)return;e.preventDefault();history.pushState({},'',a.getAttribute('href'));render()}));document.querySelectorAll('.work-card').forEach(c=>c.addEventListener('pointermove',e=>{let r=c.getBoundingClientRect();c.style.setProperty('--mx',`${e.clientX-r.left}px`);c.style.setProperty('--my',`${e.clientY-r.top}px`)}));document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');let f=b.dataset.filter,n=0;document.querySelectorAll('[data-group]').forEach(x=>{let show=f==='all'||x.dataset.group.split(' ').includes(f);x.style.display=show?'':'none';if(show)n++});let note=document.getElementById('tableNote');if(note)note.classList.toggle('show',n===0)}));let f=document.getElementById('form');if(f)f.addEventListener('submit',e=>{e.preventDefault();let n=document.getElementById('name').value,em=document.getElementById('email').value,m=document.getElementById('message').value;location.href=`mailto:hello@alejandrohennessey.com?subject=Project inquiry from ${encodeURIComponent(n)}&body=${encodeURIComponent(m+'\n\nReply to: '+em)}`;document.getElementById('status').style.display='block'})}
const cursor=document.getElementById('cursor'),cursorLabel=document.getElementById('cursorLabel');window.addEventListener('pointermove',e=>{cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px';cursorLabel.style.left=e.clientX+'px';cursorLabel.style.top=e.clientY+'px'});document.addEventListener('pointerover',e=>{if(e.target.closest('a,.filter,button')){cursor.classList.add('active');cursorLabel.classList.add('show')}});document.addEventListener('pointerout',e=>{if(e.target.closest('a,.filter,button')){cursor.classList.remove('active');cursorLabel.classList.remove('show')}});document.getElementById('menu').addEventListener('click',()=>document.querySelector('.topbar').classList.toggle('open'));window.addEventListener('popstate',render);render();
</script><script>
(function(){
  const applyCompactHeadline=()=>{
    const title=document.querySelector('.hero h1');
    if(title&&!title.dataset.compact){
      title.innerHTML='Design the next<br><em>move.</em>';
      title.dataset.compact='true';
    }
  };
  applyCompactHeadline();
  new MutationObserver(applyCompactHeadline).observe(document.getElementById('app'),{childList:true,subtree:true});
})();
</script><script src="/enhancements.js"></script></body></html>
